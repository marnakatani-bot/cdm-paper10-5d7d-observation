:10px;padding:12px}.metric{font-size:24px;font-weight:800}.countbox{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px}.tag{display:inline-block;border:1px solid #d9dce4;background:#f8f9fb;color:#637081;border-radius:5px;padding:1px 8px;font-size:11px}.tag.lav{border-color:#d9cee9;color:var(--violet);background:#f8f4ff}.tag.yellow{background:#fff6e7;color:#7b5c21}.report{white-space:pre-wrap;font-family:inherit;background:#f8f8fa;padding:13px;border-radius:10px;border:1px solid var(--line);max-height:380px;overflow:auto}.question{border-bottom:1px solid var(--line);padding:18px 0}.question:last-child{border:0}.question .question-title{font-weight:800;margin-bottom:4px}.foot{padding:16px;font-size:12px;color:var(--sub)}.saved-status{font-size:12px;color:var(--sub)}.summary-table{border-collapse:collapse;width:100%;font-size:13px}.summary-table th,.summary-table td{border-bottom:1px solid var(--line);text-align:left;padding:9px 8px;vertical-align:top}.summary-table th{background:#f8f8fb;color:#566274}.muted-block{background:#f6f7f9;border:1px solid var(--line);border-radius:9px;padding:14px}.empty{color:var(--sub);border:1px dashed #d5d9e1;border-radius:11px;text-align:center;padding:24px 12px;margin:7px 0}.index-num{font-variant-numeric:tabular-nums;color:var(--violet);font-weight:800}.blocker{color:#905f23}.mini-circle{display:inline-block;width:8px;height:8px;border-radius:100%;background:#c6bacd;margin-right:6px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#toast{position:fixed;right:20px;bottom:20px;max-width:min(480px,90vw);z-index:9;background:#293245;color:white;padding:13px 17px;box-shadow:0 9px 32px rgba(0,0,0,.16);border-radius:12px;opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}#toast.show{opacity:1;transform:none}footer{margin:50px 0;color:var(--sub)}

<script>
(()=>{
'use strict';
const STORE='maria_paper10_fieldbook_v1';
const navItems=[['home','ホーム','全体の進捗'],['timeline','時期と前提','最初に記入'],['sources','原記録台帳','回収・重複'],['case5','5次元の事例票','RS-A'],['case7','7次元の事例票','RS-B'],['protocol','比較手順書','草案と固定'],['questions','未確定事項','確認の管理'],['predictions','予想メモ','先に分離'],['compare','照合・RS-C','固定後に使う'],['export','書き出し','持ち出し・復元']];
const defaultProtocol={
 scope:'対象：著者が5次元・7次元の視座で観測した、場面または経過を識別できる一人称記録。媒体は日記・メモ・SNS・メール・はてな・Substack・Research Sketch・maria-memo・公開観測アーカイブ・非公開対話を候補とする。媒体名だけで採否を決めず、全候補を台帳に残す。原典READMEと既刊論文は分類基準・先行記述として参照し、独立観測事例としては数えない。\n含める：筆者の逐語、本人が訂正・確認した記述。場面・体験時点・最初の記録時点の分かる範囲を保存。\n除外：AIのみの解釈、他者の体験、一般的説明、単一視座に分類できない複合記録。保留・除外理由を必ず残す。',
 frame:'原典：CDM公式README（2026年11月13日著者確定定義、参照SHA 2d8d9934934bc3bd98e0ae28f8e273e318c99e99）。\n5D：統合観測／中心／宇宙の源の視座／完全完璧／宇宙系の可観測域。\n7D：情報観測／媒体／情報の視座／情報／宇宙系全体。\n分類は記事タイトルや語彙だけで決めず、原文・根拠・著者の確認を記録する。5D・7D・複数視座・分類不能・対象外を区別する。',
 dimensions:'表2の六項目：観測範囲／現れ方／たとえ／把握までの経過／捉えた内容／観測の起点。\n主に比較する候補：現れ方、把握までの経過、捉えた内容、個別観測の範囲。\n定義由来の差：視座・視点・人間の位置・視野・一致・感情は別表へ。語の一致・たとえは参考記録とする。\n選択式を使う場合は、各選択肢の意味・適用範囲を結果確認前に確定する。合わない記録は「その他」や逐語のまま残す。',
 unit:'一件＝一つの体験、または一続きの観測。同一体験の再記述は重複IDでまとめ、原記録を代表として後日の再記述を別欄に残す。別媒体・別語でも同一場面なら件数を増やさない。\n主事例の選び方（提案）：各次元について現れ方と経過が記録されている事例のうち、最初の記録日が最も早い一件。日付不明・同日の複数候補は、結果を読む前に処理規則を追記して固定する。その他の組は探索的比較として別に全件表示する。',
 criteria:'対応：比較する双方に観測の経過・関係を判定できる記述があり、事前固定した同じ関係を確認できる場合。語が同じだけでは対応にしない。\n不対応：双方に比較可能な記述があり、関係の違い・矛盾を明示できる場合。語が異なるだけでは不対応にしない。\n判断不能：どちらかの記述不足、原典の時点や視座の不確実性、関係の解釈保留などの場合。\n対応の理由は原文箇所ごとに記し、定義上当然の差と分ける。AIによる新たな構造判定は提案扱いとし、著者の採否を残す。',
 controls:'対称組5D・7Dを、対称でない組4D・7D、5D・8Dとも同じ項目で比較する案を保持する。既存のRS012は5D・8Dに関係するため、その一次記述と重複を点検する。対照資料の採り方・比較単位は結果を見る前に確定する。対照事例が不足するときは判断不能として残す。',
 time:'体験時点／最初の記録日／公開日／再記述日／研究上の解釈日／6D鏡面と5D↔7Dの見通しを持った日を分ける。9/28など公開日の前後だけで「仮説を知る前・後」を決めない。原記録を回収してから現在の回顧を書く。新しい予想は別ページに日付付きで残す。',
 freeze:'事前固定：対象範囲・検索の範囲・分類・事例ID・比較項目・判定基準・主事例の選び方・対照組の扱いを、照合前に著者が確認する。固定版のJSON/Markdownを書き出し、必要に応じてGitHubでコミットSHAを保存する。\n変更は元の固定版を消さず、日付・理由・変更時点で結果を閲覧済みか・旧版と新版の比較を残す。このHTML内の固定はローカル版管理であり、第三者による日時証明を意味しない。',
 notes:'設計状態：下書き。Fableによる設計案を整理した初期案で、著者の採用・確定前。5D・7Dの原観測を用いた対応結果は未判定。一次観測の著者語を勝手に置換しない。',
};
const questionSeeds=[
 ['5D・6D・7Dの各視座にあった時期','資料の取得と著者による照合が必要','各時期の前後、根拠となる最古の記録を確認する。'],
 ['6次元を鏡面とする配置を最初に持った時点','記録検索と著者確認','9月28日の公開と、着想の発生時点は区別する。'],
 ['5Dと7Dが向き合う見通しを最初に持った時点','記録検索と著者確認','最初の見通しを持った日と最初の公開日を別に記入する。'],
 ['5D・7Dの時期に書かれた原記録の所在と件数','一次資料の全件回収で確認','著者の日記、メモ、SNS、対話などを候補として台帳化する。'],
 ['5D・7Dの観測は現在も起きるか','著者の一次観測で確認','起きる場合は新規記録として既存の回顧と区別する。'],
 ['すり鉢と漏斗を論文⑨の作業仮説1資料として分けるか','著者の研究判断','5D・7Dの比較から除く範囲を確定する。'],
 ['7Dに「捉えた内容」にあたる観測があるか','著者の原記録で確認','法則を読む8Dと7Dの情報観測を区別する。'],
 ['同じ形の観測の意味をどう定めるか','著者による明確化が必要','4D・8Dの濃淡→中心／規則と同型か、5D・7D固有の関係か。'],
 ['RS022の表題・引用の整合','実稿と引用表の照合で確認','本文の題名と論文⑨の参考文献表記が一致するか。'],
 ['事前固定する主事例の同日タイブレーク','著者承認を要する方法上の選択','該当する場合の機械的な選定規則を定める。'],
 ['対称でない組の対象記録を十分に確保できるか','原記録の回収後に判断','RS012の5D・8Dと、4D・7Dの記録の所在を確認する。'],
];
const stepDefs=[

 ['mirror','鏡面と5D↔7Dの見通しが生まれた時期を記入する','公開日と、最初に考えた日を分ける。'],
 ['sources','既存の原記録を回収する','先に原文と所在を残し、回顧は別欄に。'],
 ['candidate','全候補に採否・重複ID・視座の根拠を付ける','都合の合う記録だけを選ばない。'],
 ['protocol','比較手順書と事例票を確定する','照合を始める前に版を固定し、JSONを持ち出す。'],
 ['rsa','5DのRS-A素材を2〜3事例に整理する','公開自体は著者判断。'],
 ['rsb','7DのRS-B素材を2〜3事例に整理する','RS-Aと独立に、同じ書式で記録する。'],

 ['paper','論文⑩の本文へ進む','先に結果と限界を整理する。'],

const createState=()=>({schema:1,createdAt:new Date().toISOString(),title:'論文⑩｜5次元と7次元の観測',timeline:{d5:'',d6:'',d7:'',mirrorThought:'',mirrorEvidence:'',pairThought:'',pairEvidence:'',other:'',preKnowledge:''},checks:{},sources:[],cases:[],protocol:{...defaultProtocol},protocolLock:{locked:false,rev:0,lockedAt:'',fingerprint:'',snapshot:null,history:[]},questions:questionSeeds.map((x,i)=>({id:'q'+(i+1),title:x[0],canInfer:x[1],hint:x[2],status:'未確認',answer:'',evidence:''})),predictions:[],comparisons:[],sketchNotes:{A:'',B:'',C:''},sketchStatuses:{A:'資料回収中',B:'資料回収中',C:'未着手'},sourceScope:'',researchNote:'',lastSave:''});
let state,active='home',selectedSource=null,selectedCase={case5:null,case7:null},selectedComparison=null,saveTimer=null,storageOK=true,toastTimer=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function attr(v){return esc(v)}
function uid(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function now(){return new Date().toISOString()}
function jaTime(s){if(!s)return '未記録';try{return new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return s}}
function ensureState(s){const d=createState();if(!s||typeof s!=='object'||s.schema!==1||!Array.isArray(s.cases)||!Array.isArray(s.sources))throw Error('このアプリで扱える形式ではありません。');return {...d,...s,timeline:{...d.timeline,...s.timeline},checks:{...d.checks,...s.checks},protocol:{...defaultProtocol,...s.protocol},protocolLock:{...d.protocolLock,...s.protocolLock},questions:Array.isArray(s.questions)?s.questions:d.questions,predictions:Array.isArray(s.predictions)?s.predictions:[],comparisons:Array.isArray(s.comparisons)?s.comparisons:[],sketchNotes:{...d.sketchNotes,...s.sketchNotes},sketchStatuses:{...d.sketchStatuses,...s.sketchStatuses}}}
function load(){try{let txt=localStorage.getItem(STORE);state=txt?ensureState(JSON.parse(txt)):createState();storageOK=true}catch(e){state=createState();storageOK=false;console.warn('storage disabled:',e)} }
function save(){state.lastSave=now();try{localStorage.setItem(STORE,JSON.stringify(state));storageOK=true;updateSave()}catch(e){storageOK=false;updateSave();console.warn(e)}}
function queuedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,320);const el=document.getElementById('saved-status');if(el)el.textContent='入力を保存中…'}
function updateSave(){const t=document.getElementById('saved-status'),p=document.getElementById('save-pill');if(t)t.textContent=storageOK?'自動保存 · '+jaTime(state.lastSave):'自動保存できません。JSONへ保存してください';if(p){p.textContent=storageOK?'端末内に自動保存':'保存要確認';p.className='pill '+(storageOK?'grey':'pending')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function btn(txt,action,classes='secondary',extra=''){return `<button type="button" class="btn ${classes}" data-action="${action}" ${extra}>${txt}</button>`}
function field(label,kind,id,key,value,config={}){const {textarea=false,long=false,help='',options=null,rows=4,disabled=false,placeholder=''}=config;const tag=`data-kind="${kind}" data-id="${attr(id||'')}" data-field="${attr(key)}" ${disabled?'disabled':''}`;let elem=options?`<select ${tag}>${options.map(x=>{const ov=(x&&typeof x==='object')?x.value:x;const ol=(x&&typeof x==='object')?x.label:x;return `<option value="${attr(ov)}" ${String(ov)===String(value)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`:textarea?`<textarea ${tag} rows="${rows}" class="${long?'long':''}" placeholder="${attr(placeholder)}">${esc(value)}</textarea>`:`<input type="text" ${tag} value="${attr(value)}" placeholder="${attr(placeholder)}">`;return `<div class="form-field"><label>${esc(label)}</label>${elem}${help?`<span class="form-help">${esc(help)}</span>`:''}</div>`}
function descItem(head,body){return `<div class="step"><span class="index-num">✓</span><div><b>${esc(head)}</b><span class="desc">${esc(body)}</span></div></div>`}
function srcLink(url,label){return `<a href="${attr(url)}" target="_blank" rel="noopener noreferrer">${esc(label||url)}</a>`}
function getCase(id){return state.cases.find(x=>x.id===id)}
function getSource(id){return state.sources.find(x=>x.id===id)}
function txt(v){return (v||'').trim()}
function statCount(){return {src:state.sources.length,d5:state.cases.filter(c=>c.dimension==='5D').length,d7:state.cases.filter(c=>c.dimension==='7D').length,questions:state.questions.filter(q=>q.status==='解決').length,compare:state.comparisons.length};}
function renderNav(){let n=statCount();document.getElementById('nav').innerHTML=navItems.map(([id,name,sub])=>`<button type="button" class="${id===active?'active':''}" data-action="nav" data-target="${id}">${esc(name)}${id==='sources'?`<span class="num">${n.src}</span>`:id==='case5'?`<span class="num">${n.d5}</span>`:id==='case7'?`<span class="num">${n.d7}</span>`:''}</button>`).join('')}
function render(){const navInfo=navItems.find(x=>x[0]===active)||navItems[0];renderNav();document.getElementById('page-title').textContent=navInfo[1];document.getElementById('page-subtitle').textContent=navInfo[2];document.getElementById('content').innerHTML=({home:renderHome,timeline:renderTimeline,sources:renderSources,case5:()=>renderCases('5D'),case7:()=>renderCases('7D'),protocol:renderProtocol,questions:renderQuestions,predictions:renderPredictions,compare:renderCompare,export:renderExport}[active]||renderHome)();updateSave()}
function progress(){let done=stepDefs.filter(x=>state.checks[x[0]]).length;return Math.round(100*done/stepDefs.length)}

 <div class="cards"><div class="card"><div class="lab">原記録</div><div class="big">${n.src}<span class="tiny muted"> 件</span></div></div><div class="card"><div class="lab">5D ／ 7Dの事例</div><div class="big">${n.d5} <span class="tiny muted">／</span> ${n.d7}</div></div><div class="card"><div class="lab">工程の確認</div><div class="big">${stepDefs.filter(s=>state.checks[s[0]]).length}<span class="tiny muted"> / ${stepDefs.length}</span></div></div></div>

 <div class="grid2"><div class="panel"><h3>Research Sketchの準備</h3><p class="help">A・Bは独立して記録し、Cで初めて照合します。</p><div class="stack"><div><b>RS-A｜5D「完全完璧」</b><div class="tiny muted">当時の場面と、何がどう現れたかを2〜3場面。</div></div><div><b>RS-B｜7D「情報」</b><div class="tiny muted">名前・意味・形がつく前の観測を2〜3場面。</div></div><div><b>RS-C｜5Dと7Dの比較</b><div class="tiny muted">手順書の事前固定後、対応・不対応・判断不能を記録。</div></div></div><div class="toolbar" style="margin-top:12px">${btn('RS-Aを開く','go-5','small')}${btn('RS-Bを開く','go-7','small')}</div></div>
 <div class="panel"><h3>大切な順序</h3><p>原記録を回収したあと、現在の回顧を別欄に書きます。途中で対応が思い浮かんだら、<b>予想メモ</b>に日付を付けて保管します。</p><p class="help">比較は手順書を固定してから。固定前にも論点の整理はできますが、比較結果の記録は開始できません。</p>${btn('予想メモ','go-predictions','secondary small')} ${btn('手順書を確認','go-protocol','secondary small')}</div></div>
 <div class="panel soft"><h3>研究本文の骨子</h3><p>1 問題設定 → 2 対象記録と方法 → 3 著者の一次観測 → 4 比較結果 → 5 対称配置との関係 → 6 考察・結論。本文末にAI使用・貢献開示、付録として手順書・候補一覧・事例票を置く予定です。</p>${field('論文⑩全体の作業メモ','root','','researchNote',state.researchNote,{textarea:true,help:'著者の自由メモ。確定済みの研究定義とは区別して保存します。'})}</div>`}
function renderTimeline(){const t=state.timeline;return `<div class="panel"><h2>最初に確認する時点</h2><p class="help">時期が曖昧でも「おおよそ」「未確認」のまま書けます。公開日と見通しを最初に持った日は別に記録します。</p><div class="grid3">${field('5次元の視座にあった時期','timeline','','d5',t.d5,{placeholder:'例：年・季節／不明'})}${field('6次元の時期','timeline','','d6',t.d6)}${field('7次元の視座にあった時期','timeline','','d7',t.d7)}</div><div class="grid2">${field('「6次元を鏡面とする配置」を最初に考えた時期','timeline','','mirrorThought',t.mirrorThought)}${field('その時期の証拠・原記録の所在','timeline','','mirrorEvidence',t.mirrorEvidence,{textarea:true})}${field('「5と7が向き合う見通し」を最初に考えた時期','timeline','','pairThought',t.pairThought)}${field('その時期の証拠・原記録の所在','timeline','','pairEvidence',t.pairEvidence,{textarea:true})}</div>${field('当時の記録が残っていそうな場所','timeline','','other',t.other,{textarea:true,placeholder:'日記、スマホメモ、SNS、ブログ、対話のリンクなど'})}${field('対応仮説を知る前・後を区別するための覚え書き','timeline','','preKnowledge',t.preKnowledge,{textarea:true})}</div>
 <div class="panel"><h3>原典にある定義（分類の参照）</h3><table class="summary-table"><tr><th>次元</th><th>視座</th><th>視点</th><th>人間の位置</th></tr><tr><td>5D 統合観測</td><td>宇宙の源の視座</td><td>完全完璧</td><td>中心</td></tr><tr><td>7D 情報観測</td><td>情報の視座</td><td>情報</td><td>媒体</td></tr></table><p class="tiny muted" style="margin-top:12px">公式README 2026-11-13確定定義に基づく。視座分類は著者の観測に基づき確認し、対象や言葉だけで自動分類しません。</p></div>`}

function renderSources(){if(!selectedSource&&state.sources.length)selectedSource=state.sources[0].id;let s=getSource(selectedSource);return `<div class="section-title"><h2>原記録の回収台帳</h2>${btn('＋ 原記録を追加','add-source')}</div><div class="note warning">まず、既存の原文をそのまま回収。AI整理や現在の回顧は別の欄に置きます。候補は不採用でも削除せず、採否と理由を残すのが基本です。</div><div class="split"><div class="record-list">${state.sources.length?state.sources.map((x,i)=>`<button type="button" class="list-select ${s&&s.id===x.id?'active':''}" data-action="select-source" data-id="${attr(x.id)}"><b>${esc(x.title||'無題の原記録')} <span class="tiny muted">#${i+1}</span></b><div class="sub">${esc(x.medium||'')}${x.duplicateId?' · 重複IDあり':''}</div></button>`).join(''):'<div class="empty">原記録はまだありません。<br>＋原記録を追加 から始められます。</div>'}</div><div>${s?`<div class="panel"><div class="section-title"><h3>原記録 ${esc(s.id)}</h3>${btn('削除','delete-source','danger small',`data-id="${attr(s.id)}"`)}</div><div class="grid2">${field('資料名／見つけた場所','source',s.id,'title',s.title)}${field('媒体','source',s.id,'medium',s.medium,{options:medOpt})}${field('記録日（不明は空欄）','source',s.id,'recordedAt',s.recordedAt,{placeholder:'YYYY-MM-DD／おおよそ'})}${field('体験した時期','source',s.id,'experienceAt',s.experienceAt)}${field('原文の著者・出どころ','source',s.id,'authorSource',s.authorSource,{options:['未確認','筆者の一次発言','筆者確認済みの記述','AIの整理','他者の記述']})}${field('視座の候補','source',s.id,'dimension',s.dimension,{options:['未分類','5D','7D','複数視座','その他','分類不能']})}${field('採用状況','source',s.id,'inclusion',s.inclusion,{options:['候補','対象','除外','保留']})}${field('同一体験の重複ID','source',s.id,'duplicateId',s.duplicateId,{placeholder:'例：体験-001'})}</div>${field('原記録のURL・ファイル名・ページ','source',s.id,'url',s.url)}${field('原文（逐語・編集しない）','source',s.id,'verbatim',s.verbatim,{textarea:true,long:true,placeholder:'観測したときの原文をそのまま貼り付ける'})}<details><summary>採否・分類根拠・後日の説明</summary>${field('採否・除外・保留の理由','source',s.id,'inclusionReason',s.inclusionReason,{textarea:true})}${field('視座分類の根拠（原典の行と原文箇所）','source',s.id,'classificationReason',s.classificationReason,{textarea:true})}${field('後日の解釈・AI整理・注記（原文と区別）','source',s.id,'notes',s.notes,{textarea:true})}</details></div>`:'<div class="empty">原記録を追加すると、ここに入力欄が表示されます。</div>'}</div></div>`}
const caseCommon1=[['scene','場面：何が起きたか'],['place','どこで・何をしていたか'],['target','対象：何を観測していたか'],['appearance','現れ方：感覚・差・動き'],['process','経過：始まり方・続いた時間・変化'],['captured','捉えた内容：何を捉えたか／捉えなかったか'],['scope','範囲と位置：どこまで及び、自分はどこにいたか'],['language','言語化の時点：最中か後か'],['originalWords','当時の観測語（逐語）'],['metaphorThen','当時のたとえ'],['metaphorNow','後から付いたたとえ']];

function renderCases(dim){let view=dim==='5D'?'case5':'case7';let list=state.cases.filter(x=>x.dimension===dim);if(!getCase(selectedCase[view])&&list.length)selectedCase[view]=list[0].id;const c=getCase(selectedCase[view]);let is5=dim==='5D';return `<div class="section-title"><h2>${is5?'RS-A｜5次元「完全完璧」':'RS-B｜7次元「情報」'}</h2>${btn('＋ 新しい事例票','add-case','',`data-dim="${dim}"`)}</div><div class="note"><b>${is5?'5D：宇宙の源の視座｜完全完璧':'7D：情報の視座｜情報'}</b>。同じ項目を同じ順に使い、当時の言葉と現在の解釈を分けます。2〜3場面は目安で、場面が足りない場合は空欄や「不明」を残せます。</div><div class="split"><div class="record-list">${list.length?list.map((x,i)=>`<button type="button" class="list-select ${c&&c.id===x.id?'active':''}" data-action="select-case" data-id="${attr(x.id)}" data-view="${view}"><b>${esc(x.scene||'場面未記入')} <span class="tiny muted">#${i+1}</span></b><div class="sub">${esc(x.experienceAt||'体験時期未確認')} · ${esc(x.status)}</div></button>`).join(''):'<div class="empty">事例票はまだありません。</div>'}</div><div>${c?`<div class="panel"><div class="section-title"><h3>事例 ${esc(c.id)}</h3>${btn('削除','delete-case','danger small',`data-id="${attr(c.id)}"`)}</div><div class="grid2">${field('整理の状態','case',c.id,'status',c.status,{options:['資料回収中','原文回収済み','著者確認待ち','記述確認済み','保留']})}${field('鏡面・対称の見通しを知る前後','case',c.id,'knowledge',c.knowledge,{options:['未確認','見通しを知る前の記録','見通しを知った後の記録','回顧による記述']})}</div><details open><summary>① 観測の場面・現れ方・経過（共通項目）</summary>${renderCaseFields(c,caseCommon1)}</details><details><summary>② ${is5?'5D':'7D'}の観測を詳しく残す</summary><div class="note">著者の観測した語をそのまま使って記入。原典の定義語を埋めるために体験を当てはめる必要はありません。</div>${renderCaseFields(c,is5?case5Extra:case7Extra)}</details><details><summary>③ 原文・時点・視座の根拠・不明点</summary>${renderCaseFields(c,caseCommon2)}</details></div><div class="panel soft"><h3>Research Sketch用メモ</h3>${field('RS-'+(is5?'A':'B')+' の構成・観測上の問い','sketch','',''+(is5?'A':'B'),state.sketchNotes[is5?'A':'B'],{textarea:true,long:true,help:'掲載文の下書きではなく、素材と構成の整理に使えます。'})}${field('現在の工程','sketchstatus','',''+(is5?'A':'B'),state.sketchStatuses[is5?'A':'B'],{options:['資料回収中','原文回収済み','骨子作成中','著者確認待ち','公開済み','保留']})}</div>`:'<div class="empty">「＋ 新しい事例票」を押して場面ごとに記録してください。</div>'}</div></div>`}
const protocolSections=[['scope','1. 対象記録・選定範囲'],['frame','2. 5D・7Dの分類根拠'],['dimensions','3. 比較項目'],['unit','4. 事例の単位・重複・主事例'],['criteria','5. 対応・不対応・判断不能の判定'],['controls','6. 対称でない組・対照'],['time','7. 時点・回顧・既知情報'],['freeze','8. 事前固定・変更履歴'],['notes','9. 制約・その他の留保']];
function fnvhash(v){let h=2166136261;let s=JSON.stringify(v);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
function renderProtocol(){let l=state.protocolLock;return `<div class="note ${l.locked?'good':'warning'}"><b>${l.locked?'比較手順書 v'+l.rev+'｜ローカル固定済み':'比較手順書｜草案・著者確定前'}</b><br>${l.locked?`固定日時：${esc(jaTime(l.lockedAt))}／照合用識別子：${esc(l.fingerprint)}。固定版を保全しています。変更する場合は理由を残して改訂版へ。`:'Fableの提案を元にした編集可能な下書きです。原記録と未確定事項を確認し、判定基準を採用する前に内容を修正してください。'}</div><div class="panel"><div class="section-title"><h2>比較前に固定する手順書</h2><div class="toolbar">${btn('手順書をMarkdownで保存','export-protocol','secondary small')}${l.locked?btn('改訂版を作成','revise-protocol','secondary small'):btn('著者確認後に固定する','lock-protocol','small')}</div></div><p class="help">「固定」はこのHTMLの中に版の控えを作る操作です。第三者に日時を示すには、書き出したファイルをGitHub等にコミットしてSHAを控える工程が必要です（このアプリからは実行しません）。</p>${protocolSections.map(([key,title])=>field(title,'protocol','',key,state.protocol[key],{textarea:true,long:['scope','criteria'].includes(key),disabled:l.locked})).join('')}</div><div class="panel"><h3>固定・改訂の履歴</h3>${l.history.length?`<table class="summary-table"><tr><th>版</th><th>時点</th><th>変更理由／内容</th></tr>${l.history.map(h=>`<tr><td>v${esc(h.rev)}<br><span class="tiny">${esc(h.fingerprint)}</span></td><td>${esc(jaTime(h.at))}</td><td>${esc(h.reason||'初回固定')}<br><span class="tiny muted">結果閲覧：${esc(h.seen||'未申告')}</span></td></tr>`).join('')}</table>`:'<p class="muted">固定した版はありません。</p>'}</div>`}
function renderQuestions(){let solved=state.questions.filter(x=>x.status==='解決').length;return `<div class="section-title"><h2>未確定事項と判断待ち</h2><span class="tag">解決 ${solved}/${state.questions.length}</span></div><p class="help">「推論で埋まるか」はFableの提案に基づく初期表示です。記録検索で確認できる点と、著者の判断が必要な点を区別してください。</p><div class="panel">${state.questions.map((q,i)=>`<div class="question"><div class="question-title">${i+1}. ${esc(q.title)}</div><p class="tiny muted">確認方法：${esc(q.canInfer)}。${esc(q.hint||'')}</p><div class="grid2">${field('状態','question',q.id,'status',q.status,{options:['未確認','調査中','著者判断待ち','解決','保留']})}${field('根拠となる記録・リンク','question',q.id,'evidence',q.evidence)}</div>${field('回答・判断・未確認の理由','question',q.id,'answer',q.answer,{textarea:true})}</div>`).join('')}</div>`}
function renderPredictions(){return `<div class="section-title"><h2>予想メモ（結果と分けて保管）</h2>${btn('＋ 予想を記録','add-prediction')}</div><div class="note">記録回収中に「5Dと7Dで同じかもしれない」と思ったらここへ。比較結果の欄へ移さず、書いた日と出どころを残します。</div>${state.predictions.length?state.predictions.map(p=>`<div class="panel"><div class="section-title"><h3>予想 ${esc(jaTime(p.createdAt))}</h3>${btn('削除','delete-prediction','danger small',`data-id="${attr(p.id)}"`)}</div>${field('浮かんだ予想（著者の語で）','prediction',p.id,'text',p.text,{textarea:true,long:true})}${field('きっかけ・参照した原記録','prediction',p.id,'source',p.source,{textarea:true})}${field('現在の状態','prediction',p.id,'status',p.status,{options:['予想・未検証','記録と照合予定','検証後の追記あり']})}</div>`).join(''):'<div class="empty">まだ予想メモはありません。</div>'}`}
function primaryByDate(dim){let all=state.cases.filter(x=>x.dimension===dim&&txt(x.appearance)&&txt(x.process));let undated=all.filter(x=>!/^\d{4}-\d\d-\d\d$/.test(txt(x.firstRecordedAt))).length;let candidates=all.filter(x=>/^\d{4}-\d\d-\d\d$/.test(txt(x.firstRecordedAt))).sort((a,b)=>a.firstRecordedAt.localeCompare(b.firstRecordedAt)||a.id.localeCompare(b.id));if(!candidates.length)return null;let ambiguous=candidates.filter(x=>x.firstRecordedAt===candidates[0].firstRecordedAt).length>1;return {c:candidates[0],ambiguous,undated}}
function renderCompare(){let l=state.protocolLock, p5=primaryByDate('5D'),p7=primaryByDate('7D');let guess=p5&&p7&&!p5.ambiguous&&!p7.ambiguous&&!p5.undated&&!p7.undated;let counts={対応:0,不対応:0,判断不能:0,未判定:0};state.comparisons.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);return `<div class="section-title"><h2>照合・RS-Cの記録</h2>${btn('＋ 比較票を追加','add-comparison','',l.locked?'':'disabled')}</div>${!l.locked?'<div class="note warning"><b>比較前の段階です。</b> 手順書が未固定のため、比較結果の入力を開いていません。予想が浮かんだら「予想メモ」に記録してください。</div>':`<div class="note good">手順書 v${l.rev} を固定済み。対応・不対応・判断不能の根拠は、両側の原文から明記してください。判定は著者が確認します。</div>`}
 <div class="grid3" style="margin-bottom:18px"><div class="countbox"><span class="lab">対応</span><div class="metric">${counts.対応}</div></div><div class="countbox"><span class="lab">不対応</span><div class="metric">${counts.不対応}</div></div><div class="countbox"><span class="lab">判断不能／未判定</span><div class="metric">${counts.判断不能+counts.未判定}</div></div></div><div class="panel"><h3>主事例の機械的な選定候補</h3><p class="help">Fable案：各次元で「現れ方」「経過」が記述され、最初の記録日が最も早い事例。日付が不明な記録は先に確認する必要があります。同日に複数ある場合は、ルールを先に固定してください。</p><div class="grid2"><div class="subtle"><b>5D候補</b><div>${p5?`${esc(p5.c.scene||p5.c.id)}（${esc(p5.c.firstRecordedAt)}）${p5.ambiguous?'｜同日候補が複数':''}${p5.undated?'｜記録日不明候補あり':''}`:'日付と必要項目を備えた候補なし'}</div></div><div class="subtle"><b>7D候補</b><div>${p7?`${esc(p7.c.scene||p7.c.id)}（${esc(p7.c.firstRecordedAt)}）${p7.ambiguous?'｜同日候補が複数':''}${p7.undated?'｜記録日不明候補あり':''}`:'日付と必要項目を備えた候補なし'}</div></div></div><p class="tiny muted" style="margin-top:12px">${guess?'候補は一意に選ばれています。主結果への採用は著者が手順書と照合して確定します。':'主事例はまだ一意に定まりません。ここで恣意的に選択しないでください。'}</p></div>
 ${l.locked?`${state.comparisons.length?state.comparisons.map((c,i)=>`<div class="panel"><div class="section-title"><h3>比較票 #${i+1} <span class="tag">${esc(c.status)}</span></h3>${btn('削除','delete-comparison','danger small',`data-id="${attr(c.id)}"`)}</div><div class="grid2">${field('5Dの事例','comparison',c.id,'case5',c.case5,{options:[{value:'未選択',label:'未選択'},...state.cases.filter(x=>x.dimension==='5D').map(x=>({value:x.id,label:x.id+'｜'+(x.scene||'場面未記入')}))]})}${field('7Dの事例','comparison',c.id,'case7',c.case7,{options:[{value:'未選択',label:'未選択'},...state.cases.filter(x=>x.dimension==='7D').map(x=>({value:x.id,label:x.id+'｜'+(x.scene||'場面未記入')}))]})}${field('位置づけ','comparison',c.id,'mode',c.mode,{options:['未指定','主事例（手順書で確定）','探索的な組み合わせ','対称でない組の対照']})}${field('総合判定','comparison',c.id,'status',c.status,{options:['未判定','対応','不対応','判断不能']})}${field('現れ方の判定','comparison',c.id,'appearanceResult',c.appearanceResult,{options:['未判定','対応','不対応','判断不能']})}${field('把握までの経過の判定','comparison',c.id,'processResult',c.processResult,{options:['未判定','対応','不対応','判断不能']})}${field('捉えた内容の判定','comparison',c.id,'capturedResult',c.capturedResult,{options:['未判定','対応','不対応','判断不能']})}${field('観測範囲の判定','comparison',c.id,'scopeResult',c.scopeResult,{options:['未判定','対応','不対応','判断不能']})}</div>${field('対応・不対応の理由（双方の逐語を示す）','comparison',c.id,'rationale',c.rationale,{textarea:true,long:true})}${field('定義由来の差・語の一致・たとえ（集計外）','comparison',c.id,'notCounted',c.notCounted,{textarea:true})}${field('資料不足・判断不能・分類変更の根拠','comparison',c.id,'unknown',c.unknown,{textarea:true})}</div>`).join(''):'<div class="empty">比較票はまだありません。手順書の基準を確認してから追加してください。</div>'}`:''}
 <div class="panel soft"><h3>RS-Cの整理メモ</h3>${field('対応・不対応・判断不能から見えた点','sketch','','C',state.sketchNotes.C,{textarea:true,long:true,disabled:!l.locked})}${field('現在の工程','sketchstatus','','C',state.sketchStatuses.C,{options:['未着手','比較中','著者確認待ち','骨子作成中','公開済み','保留'],disabled:!l.locked})}</div>`}
function renderExport(){return `<div class="panel"><h2>記録を端末の外へ保管する</h2><p>このHTMLはインターネットに送信しないローカルアプリ。入力は同じブラウザの保存領域へ自動保存する方式です。ブラウザ・端末を変更すると記録は自動では引き継がれません。<b>原記録を入れた後は、JSONバックアップを定期的に保存してください。</b></p><div class="grid2"><div class="countbox"><h3>完全バックアップ</h3><p class="help">原記録、事例、手順書、未確定事項、比較票をまとめて復元できます。</p>${btn('JSONをダウンロード','export-json')}</div><div class="countbox"><h3>読み物としての書き出し</h3><p class="help">Fableや他のAI・研究者へ渡す場合に。記述に個人情報が含まれるときは共有前に確認してください。</p><div class="toolbar">${btn('研究ノート全文（MD）','export-md','secondary')}${btn('手順書のみ（MD）','export-protocol','secondary')}</div></div></div><div class="hr"></div><h3>別の端末・ブラウザから復元する</h3><p class="help">JSONはこのアプリが作成した形式のみ受け付けます。読み込むと、今この端末にある記録が置き換わります。事前のバックアップをおすすめします。</p>${btn('JSONバックアップを読み込む','trigger-import','secondary')}<div class="hr"></div><h3>印刷・PDF保存</h3>${btn('現在の画面を印刷','print','secondary')}<p class="tiny muted" style="margin-top:10px">ブラウザの「印刷」からPDF保存もできます。長文の事例全件を渡すときはMarkdownを書き出してください。</p></div>
 <div class="panel"><h2>参照先</h2><div class="link-list">${srcLink('https://docs.google.com/document/d/1vFg3lOhV6AyDmaJxydf64yBcabx5eQqMly97rz5Zz-w/edit','論文⑨完成稿｜鏡面構造（特に1.3・2.3・3.2〜3.4・5.2・付録B）')}${srcLink('https://github.com/marnakatani-bot/maria-dimension-map-/blob/main/README.md','公式README｜2026年11月13日確定の次元定義')}${srcLink('https://github.com/marnakatani-bot/maria-memo/tree/main/theory','maria-memo｜theory原記録索引')}${srcLink('https://app.notion.com/p/412d4325d3d581ebb9afe206551a564a','Notion｜深い推論・独立検証プロトコル')}${srcLink('https://app.notion.com/p/3ced4325d3d58192b901ce99b257f60e','RS012｜5次元の「手放し」は、8次元の情報固定解除である')}${srcLink('https://app.notion.com/p/403d4325d3d581de9405d25d865f2daf','RS021｜6次元鏡面と観測起点の反転')}${srcLink('https://docs.google.com/document/d/1glgjtxTEaW2zLVvUD_X3XC-_RNJiIv-uI5S6ZHZmYok/edit','RS022｜6次元鏡面を挟んで続く人間の働きと観測主体の反転')}</div><p class="tiny muted" style="margin-top:14px">公式README 取得時 SHA 2d8d9934934bc3bd98e0ae28f8e273e318c99e99。外部URLは閲覧用で、アプリからデータは送信しません。</p></div>
 <div class="panel"><h3>端末内の記録を消す</h3><p class="help">削除前にJSONへバックアップしてください。この操作は取り消せません。</p>${btn('全データを初期化','reset','danger')}</div>`}
function download(content,filename,mime){const b=new Blob([content],{type:mime});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function nameDate(){return new Date().toISOString().slice(0,10)}
function exportJSON(){clearTimeout(saveTimer);save();download(JSON.stringify(state,null,2),'まりあ研究ノート_論文10_'+nameDate()+'.json','application/json;charset=utf-8');toast('JSONバックアップを書き出しました')}
function caseMd(c){return ['# '+c.dimension+'｜'+(c.scene||c.id),'ID：'+c.id,'状態：'+c.status,'見通しとの時点関係：'+c.knowledge,...[...caseCommon1,...(c.dimension==='5D'?case5Extra:case7Extra),...caseCommon2].map(([k,l])=>'## '+l+'\n'+(c[k]||'（未記入）'))].join('\n\n')}
function protocolMd(){const l=state.protocolLock;return ['# 比較手順書｜論文⑩',`状態：${l.locked?'ローカル固定 v'+l.rev:'草案'}`,`固定日時：${l.lockedAt||'未固定'}`,`識別子：${l.fingerprint||'未固定'}`,'注：ローカルの識別子は改ざん防止・第三者のタイムスタンプの証明ではありません。','',...protocolSections.map(([k,title])=>'## '+title+'\n'+(state.protocol[k]||'（未記入）')),'','## 改訂記録',...l.history.map(h=>'- v'+h.rev+'｜'+h.at+'｜'+(h.reason||'初回固定')+'｜結果閲覧：'+(h.seen||'未申告')+'｜識別子：'+h.fingerprint)].join('\n\n')}
function exportProtocol(){download(protocolMd(),'論文10_比較手順書_'+nameDate()+'.md','text/markdown;charset=utf-8');toast('比較手順書を書き出しました')}
function exportMD(){let arr=['# まりあ研究ノート｜論文⑩','作成：'+state.createdAt,'書き出し：'+now(),'研究の問い：5D・7Dの記録に、6D鏡面を挟む対称位置との対応が見えるか。','', '## 時期と前提',...Object.entries({d5:'5Dの時期',d6:'6Dの時期',d7:'7Dの時期',mirrorThought:'鏡面着想',mirrorEvidence:'鏡面根拠',pairThought:'5D↔7D着想',pairEvidence:'見通しの根拠',other:'既存資料の所在',preKnowledge:'予想以前と以後の区分'}).map(([k,l])=>'- '+l+'：'+(state.timeline[k]||'未確認')),'','## 工程',...stepDefs.map(([k,t])=>'- ['+(state.checks[k]?'x':' ')+'] '+t),'','## 原記録台帳',...state.sources.map((s,i)=>['### '+(i+1)+' '+(s.title||s.id),...Object.entries({id:'ID',medium:'媒体',url:'所在',recordedAt:'記録時点',experienceAt:'体験時点',dimension:'視座候補',authorSource:'著者・出どころ',inclusion:'採用状況',duplicateId:'重複ID',inclusionReason:'採否の理由',classificationReason:'分類根拠'}).map(([k,l])=>l+'：'+(s[k]||'未確認')),'原文（逐語）：\n'+(s.verbatim||'未記入'),'後日の説明：\n'+(s.notes||'未記入')].join('\n\n')),'','## RS-A｜5D',...state.cases.filter(c=>c.dimension==='5D').map(caseMd),'','## RS-B｜7D',...state.cases.filter(c=>c.dimension==='7D').map(caseMd),'','## RS-A/B/C メモ',...['A','B','C'].map(k=>'### RS-'+k+'（'+state.sketchStatuses[k]+'）\n'+(state.sketchNotes[k]||'未記入')),'',protocolMd(),'','## 未確定事項',...state.questions.map(q=>['### '+q.title,'確認方法：'+q.canInfer,'状態：'+q.status,'回答：'+(q.answer||'未確認'),'根拠：'+(q.evidence||'未記入')].join('\n')),'','## 予想メモ',...state.predictions.map(p=>'### '+p.createdAt+'\n'+p.text+'\n出典：'+p.source+'\n状態：'+p.status),'','## 比較票',...state.comparisons.map(c=>['### '+c.id,'5D：'+c.case5,'7D：'+c.case7,'位置づけ：'+c.mode,'総合：'+c.status,'現れ方：'+c.appearanceResult,'経過：'+c.processResult,'内容：'+c.capturedResult,'範囲：'+c.scopeResult,'理由：'+c.rationale,'集計外：'+c.notCounted,'不明点：'+c.unknown].join('\n')),'','## 論文全体のメモ',state.researchNote];download(arr.join('\n\n'),'まりあ研究ノート_論文10_全記録_'+nameDate()+'.md','text/markdown;charset=utf-8');toast('研究ノート全文を書き出しました')}

function lockProtocol(){const q=state.questions.find(q=>['同じ形の観測の意味をどう定めるか','事前固定する主事例の同日タイブレーク'].includes(q.title)&&q.status!=='解決');const msg='この比較手順を「事前固定版」として保存します。著者による項目・判定基準の確認は済んでいますか？\n\n注意：未確定事項が残っていても固定できますが、確定済みと誤認しないよう、その理由を手順書に記入してください。\n\n固定後、比較結果の入力が開きます。';if(!showConfirm(msg))return;const l=state.protocolLock;l.rev=(l.rev||0)+1;l.locked=true;l.lockedAt=now();l.snapshot=JSON.parse(JSON.stringify(state.protocol));l.fingerprint=fnvhash(l.snapshot);l.history.push({rev:l.rev,at:l.lockedAt,fingerprint:l.fingerprint,reason:l.rev===1?'初回固定':l.pendingReason||'改訂後の固定',seen:l.pendingSeen||'未申告',snapshot:JSON.parse(JSON.stringify(l.snapshot))});delete l.pendingReason;delete l.pendingSeen;save();render();toast('ローカル固定版を保存しました。GitHub等への外部保存は別工程です。')}
function reviseProtocol(){const reason=window.prompt('手順を改訂する理由と、どの箇所を変えるかを記入してください。');if(!reason||!reason.trim()){toast('改訂は取り消されました');return}const seen=window.prompt('すでに5D・7Dの比較結果を見ていますか？「結果閲覧済み」「未閲覧」「不明」から記入してください。','未閲覧');if(seen===null){toast('改訂は取り消されました');return}let l=state.protocolLock;l.pendingReason=reason.trim();l.pendingSeen=seen.trim()||'不明';l.locked=false;save();render();toast('旧版を履歴に保存し、新しい改訂草稿を開きました')}
function reset(){if(!showConfirm('すべての原記録・事例・手順書・メモを削除します。JSONバックアップは作成済みですか？'))return;if(!showConfirm('最終確認：この端末に保存した論文⑩の全データを初期化します。よろしいですか？'))return;state=createState();selectedSource=null;selectedCase={case5:null,case7:null};save();active='home';render();toast('初期化しました')}
function clickAction(e){let b=e.target.closest('[data-action]');if(!b)return;let x=b.dataset.action;if(x==='nav'){active=b.dataset.target;render();scrollTo({top:0,behavior:'instant'})}else if(x==='go-5'||x==='go-7'||x==='go-predictions'||x==='go-protocol'){active={'go-5':'case5','go-7':'case7','go-predictions':'predictions','go-protocol':'protocol'}[x];render();scrollTo({top:0,behavior:'instant'})}else if(x==='add-source')chooseNewSource();else if(x==='select-source'){selectedSource=b.dataset.id;render()}else if(x==='delete-source'){if(showConfirm('原記録台帳からこの記録を削除しますか？ 同一体験の事例票は削除されません。')){state.sources=state.sources.filter(a=>a.id!==b.dataset.id);selectedSource=state.sources[0]?.id||null;queuedSave();render()}}else if(x==='add-case')chooseNewCase(b.dataset.dim);else if(x==='select-case'){selectedCase[b.dataset.view]=b.dataset.id;render()}else if(x==='delete-case'){if(showConfirm('事例票を削除しますか？ 比較票で参照している場合は、比較票も見直してください。')){state.cases=state.cases.filter(a=>a.id!==b.dataset.id);selectedCase.case5=null;selectedCase.case7=null;queuedSave();render()}}else if(x==='add-prediction')chooseNewPrediction();else if(x==='delete-prediction'){if(showConfirm('この予想メモを削除しますか？')){state.predictions=state.predictions.filter(a=>a.id!==b.dataset.id);queuedSave();render()}}else if(x==='add-comparison')chooseNewComparison();else if(x==='delete-comparison'){if(showConfirm('この比較票を削除しますか？')){state.comparisons=state.comparisons.filter(a=>a.id!==b.dataset.id);queuedSave();render()}}else if(x==='export-json')exportJSON();else if(x==='export-md')exportMD();else if(x==='export-protocol')exportProtocol();else if(x==='lock-protocol')lockProtocol();else if(x==='revise-protocol')reviseProtocol();else if(x==='trigger-import')document.getElementById('import-file').click();else if(x==='print')window.print();else if(x==='reset')reset();}
function inputAction(e){const el=e.target;if(!el.dataset.kind)return;let kind=el.dataset.kind,id=el.dataset.id,key=el.dataset.field;const val=el.type==='checkbox'?el.checked:el.value;if(kind==='timeline')state.timeline[key]=val;else if(kind==='check')state.checks[key]=val;else if(kind==='source'){let o=getSource(id);if(o)o[key]=val}else if(kind==='case'){let o=getCase(id);if(o)o[key]=val}else if(kind==='protocol'){if(state.protocolLock.locked)return;state.protocol[key]=val}else if(kind==='question'){let o=state.questions.find(x=>x.id===id);if(o)o[key]=val}else if(kind==='prediction'){let o=state.predictions.find(x=>x.id===id);if(o)o[key]=val}else if(kind==='comparison'){if(!state.protocolLock.locked)return;let o=state.comparisons.find(x=>x.id===id);if(o)o[key]=val}else if(kind==='sketch')state.sketchNotes[key]=val;else if(kind==='sketchstatus')state.sketchStatuses[key]=val;else if(kind==='root')state[key]=val;queuedSave()}
async function importFile(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>10*1024*1024){toast('10MBより大きいJSONは扱えません');return}try{const data=ensureState(JSON.parse(await f.text()));if(!showConfirm('既存の記録を、読み込んだJSONで置き換えます。必要なら先にバックアップしてください。\n\nファイル名：'+f.name))return;state=data;selectedSource=null;selectedCase={case5:null,case7:null};selectedComparison=null;save();active='home';render();toast('JSONから記録を復元しました')}catch(err){console.error(err);alert('読み込みに失敗しました。論文⑩アプリから書き出したJSONかご確認ください。\n'+err.message)}}
load();document.body.addEventListener('click',clickAction);document.body.addEventListener('input',inputAction);document.body.addEventListener('change',inputAction);document.getElementById('import-file').addEventListener('change',importFile);window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);save()});render();
})();
</script>
</body>
